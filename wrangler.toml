name = "antmotors"
pages_build_output_dir = "app"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 环境变量（SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY）请在 Cloudflare Pages 控制台
# → Settings → Environment variables 里设置（不要写进 wrangler.toml，Git 部署不会注入 [vars]）：
#   SUPABASE_URL              = https://<ref>.supabase.co   （普通变量 / Plain text）
#   SUPABASE_SERVICE_ROLE_KEY = <service_role key>          （Secret / 加密变量）
#
# 本地预览：wrangler pages dev --binding SUPABASE_URL=... --binding SUPABASE_SERVICE_ROLE_KEY=...
