name: Build iOS IPA (Antoto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Install Capacitor deps
        working-directory: native
        run: npm ci

      - name: Add iOS platform (if missing)
        working-directory: native
        run: |
          if [ ! -d "ios" ]; then npx cap add ios; fi

      - name: Sync web assets into native project
        working-directory: native
        run: npx cap sync ios

      - name: Inject Alipay native SDK + bridge plugin
        run: bash scripts/integrate-alipay.sh

      - name: Brand iOS icon
        run: bash scripts/brand-ios.sh

      - name: Install CocoaPods & integrate AlipaySDK
        working-directory: native/ios/App
        run: |
          if ! command -v pod >/dev/null 2>&1; then sudo gem install cocoapods -v 1.15.2; fi
          pod install --repo-update

      - name: Check for signing secrets
        id: keycheck
        run: |
          if [ -n "${CERT:-}" ] && [ -n "${PROF:-}" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CERT: ${{ secrets.ANTOTO_IOS_DIST_CERT_P12 }}
          PROF: ${{ secrets.ANTOTO_IOS_PROVISIONING_PROFILE }}

      # ---- Signed path: real IPA for TestFlight / App Store ----
      - name: Import Distribution cert & provisioning profile
        if: steps.keycheck.outputs.have_key == 'true'
        env:
          CERT_B64: ${{ secrets.ANTOTO_IOS_DIST_CERT_P12 }}
          CERT_PWD: ${{ secrets.ANTOTO_IOS_DIST_CERT_PASSWORD }}
          PROF_B64: ${{ secrets.ANTOTO_IOS_PROVISIONING_PROFILE }}
          TEAM_ID: ${{ secrets.ANTOTO_IOS_TEAM_ID }}
          PROF_NAME: ${{ secrets.ANTOTO_IOS_PROFILE_NAME }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -P "$CERT_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROF_B64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/$PROF_NAME.mobileprovision"
          echo "Imported cert + profile ($PROF_NAME)"

      - name: Archive & export signed IPA
        if: steps.keycheck.outputs.have_key == 'true'
        working-directory: native/ios/App
        env:
          TEAM_ID: ${{ secrets.ANTOTO_IOS_TEAM_ID }}
          PROF_NAME: ${{ secrets.ANTOTO_IOS_PROFILE_NAME }}
        run: |
          xcodebuild archive \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROF_NAME" | xcpretty || xcodebuild archive \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROF_NAME"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict><key>com.antmotors.app</key><string>$PROF_NAME</string></dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

      - name: Upload signed IPA
        if: steps.keycheck.outputs.have_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: antoto-ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error

      # ---- Unsigned path: compile-only verification (no Apple certs yet) ----
      - name: Build (compile verification, no signing)
        if: steps.keycheck.outputs.have_key == 'false'
        working-directory: native/ios/App
        run: |
          xcodebuild build \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO | xcpretty || xcodebuild build \
            -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO
          echo "::notice::Unsigned compile check passed. Add Apple Distribution cert + provisioning profile secrets to produce a real IPA."
