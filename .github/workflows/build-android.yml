name: Build Android APK (Antoto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor deps
        working-directory: native
        run: npm ci

      - name: Add Android platform (if missing)
        working-directory: native
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi

      - name: Sync web assets into native project
        working-directory: native
        run: npx cap sync android

      - name: Brand Android icons
        run: bash scripts/brand-android.sh

      - name: Build debug APK (auto-signed, always installable)
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check for keystore secret
        id: keycheck
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KEYSTORE_B64: ${{ secrets.ANTOTO_KEYSTORE_BASE64 }}

      - name: Build release APK (unsigned — signed below if keystore provided)
        if: steps.keycheck.outputs.have_key == 'true'
        working-directory: native/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        if: steps.keycheck.outputs.have_key == 'true'
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: native/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANTOTO_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANTOTO_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANTOTO_STORE_PASSWORD }}
          keyPassword: ${{ secrets.ANTOTO_KEY_PASSWORD }}
        env:
          BUILD_TOOL_VERSION: "36.0.0"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antoto-android-apk
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
