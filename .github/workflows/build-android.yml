name: Build Android APK (Antoto)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor deps
        working-directory: native
        run: npm ci

      - name: Add Android platform (if missing)
        working-directory: native
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi

      - name: Sync web assets into native project
        working-directory: native
        run: npx cap sync android

      - name: Brand Android icons
        run: bash scripts/brand-android.sh

      - name: Build debug APK (auto-signed, always installable)
        working-directory: native/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Check for release key password
        id: keycheck
        run: |
          if [ -n "${KP:-}" ]; then
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          KP: ${{ secrets.ANTOTO_KEY_PASSWORD }}

      - name: Build & sign release APK (deterministic key derived from password)
        if: steps.keycheck.outputs.have_key == 'true'
        working-directory: native/android
        env:
          ANTOTO_KEY_PASSWORD: ${{ secrets.ANTOTO_KEY_PASSWORD }}
          ANTOTO_KEY_ALIAS: antoto
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          python3 -m pip install --quiet cryptography
          ./gradlew assembleRelease --no-daemon
          python3 - <<'PY'
          import os, hashlib, datetime
          import cryptography
          from cryptography.hazmat.primitives.asymmetric import ec
          from cryptography.hazmat.primitives import serialization, hashes
          from cryptography.x509 import CertificateBuilder, NameOID, BasicConstraints
          from cryptography.hazmat.primitives.serialization import pkcs12
          pw = os.environ["ANTOTO_KEY_PASSWORD"].encode()
          alias = os.environ.get("ANTOTO_KEY_ALIAS", "antoto")
          n = 0xFFFFFFFF00000000FFFFFFFFFFFFFFFFBCE6FAADA7179E84F3B9CAC2FC632550
          d = (int.from_bytes(hashlib.sha256(pw).digest(), 'big') % (n - 1)) + 1
          key = ec.derive_private_key(d, ec.SECP256R1())
          serial = int.from_bytes(hashlib.sha256(b"antoto-serial" + pw).digest()[:19], 'big')
          nb = datetime.datetime(2026, 1, 1, 0, 0, 0, tzinfo=datetime.timezone.utc)
          na = datetime.datetime(2051, 1, 1, 0, 0, 0, tzinfo=datetime.timezone.utc)
          subject = cryptography.x509.Name([
              cryptography.x509.NameAttribute(NameOID.COMMON_NAME, "Antoto"),
              cryptography.x509.NameAttribute(NameOID.ORGANIZATION_NAME, "Ant Motors"),
          ])
          cert = (CertificateBuilder().subject_name(subject).issuer_name(subject)
                  .public_key(key.public_key()).serial_number(serial)
                  .not_valid_before(nb).not_valid_after(na)
                  .add_extension(BasicConstraints(ca=True, path_length=None), critical=True)
                  .sign(key, hashes.SHA256()))
          p12 = pkcs12.serialize_key_and_certificates(alias.encode(), key, cert, None,
                  serialization.BestAvailableEncryption(pw))
          with open("release-key.p12", "wb") as f:
              f.write(p12)
          der = cert.public_bytes(serialization.Encoding.DER)
          print("RELEASE_KEY_MD5", hashlib.md5(der).hexdigest().upper())
          PY
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks release-key.p12 --ks-key-alias "${ANTOTO_KEY_ALIAS}" \
            --ks-pass "pass:${ANTOTO_KEY_PASSWORD}" --key-pass "pass:${ANTOTO_KEY_PASSWORD}" \
            --out app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antoto-android-apk
          path: |
            native/android/app/build/outputs/apk/debug/*.apk
            native/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
